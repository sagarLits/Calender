spring.application.name=Calender
server.address=0.0.0.0
server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/calender?serverTimezone=Asia/Kolkata&useSSL=false&allowPublicKeyRetrieval=true
